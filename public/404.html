<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1A1510" />
    <title>Nincs ilyen oldal — Hajdu Tamás Fotós &amp; Videós</title>

    <!-- Szándékosan önálló, inline stílusú lap: nem függ a fő JS/CSS
         bundle-től, így akkor is helyesen jelenik meg, ha az nem töltődik be. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1.5rem;
        background: #1a1510;
        color: #e8ddd0;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }

      .logo {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: 1.5rem;
        letter-spacing: 0.2em;
        color: #e8ddd0;
        text-decoration: none;
      }
      .logo span { color: #c4612a; }

      .code {
        font-family: 'Courier New', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #c4612a;
      }

      h1 {
        font-family: 'Arial Black', Impact, sans-serif;
        font-size: clamp(1.8rem, 6vw, 3rem);
        font-weight: 900;
        line-height: 1.1;
      }

      p { max-width: 34rem; color: #9a9088; line-height: 1.6; }

      .links { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: center; margin-top: 0.5rem; }

      .links a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        font-family: 'Courier New', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        text-decoration: none;
        color: #e8ddd0;
        border: 1px solid #3d3530;
        transition: border-color 0.2s, color 0.2s;
      }
      .links a:hover { border-color: #c4612a; color: #c4612a; }
      .links a.primary { border-color: #c4612a; color: #c4612a; }
      .links a.primary:hover { background: #c4612a; color: #1a1510; }
    </style>
  </head>
  <body>
    <a class="logo" href="/">NOX<span>.</span></a>

    <div class="code">404</div>
    <h1>Nincs ilyen oldal</h1>
    <p>
      Lehet, hogy elírtad a címet, vagy a keresett tartalom már nem elérhető.
      Innen tovább tudsz lépni:
    </p>

    <nav class="links">
      <a class="primary" href="/">Főoldal</a>
      <a href="/portfolio">Portfólió</a>
      <a href="/#contact">Kapcsolat</a>
    </nav>
  </body>
</html>
